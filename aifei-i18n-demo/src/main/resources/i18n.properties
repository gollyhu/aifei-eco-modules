# ===== aifei-i18n-demo 本地语言包（classpath，UTF-8）=====
# 格式：<locale>|<key>=<原文>；{0}/{1} 占位符下发原文，由前端/插值器替换。
# zh-CN / en-US / ja-JP 全量；ar-SA 仅少量 key；单条取缺译时经回退链补 en-US，整包导出按来源可列举范围原样输出、不补齐缺译。

